name: tutor_blacklist_app
description: A private blacklist management app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.14.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # Database
  sqflite: ^2.4.5
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # File Handling & Cloud Upload
  file_picker: ^13.4.0
  minio: ^3.5.7
  path_provider: ^2.1.4
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
